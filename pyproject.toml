[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "winqstep"
version = "0.2.0"
description = "Unofficial Windows companion for running CP2K QuickStep through WSL2."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "ase>=3.23",
]

[tool.setuptools.packages.find]
include = ["winqstep*"]
